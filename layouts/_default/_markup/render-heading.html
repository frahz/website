<h{{ .Level }} id="{{ .Anchor | safeURL }}"{{ range $key, $value := .Attributes }}{{ if ne $key "id" }} {{ $key | safeHTMLAttr }}="{{ $value }}"{{ end }}{{ end }}>
  {{ .Text | safeHTML }}
  <a class="heading-anchor" href="#{{ .Anchor | safeURL }}" aria-label="Link to {{ .PlainText }}">#</a>
</h{{ .Level }}>
